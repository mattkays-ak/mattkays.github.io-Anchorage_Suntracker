name: Daily Anchorage Suntracker Update

on:
  schedule:
    # Runs at 16:47 UTC (8:47 AM AKDT in summer / 7:47 AM AKST in winter)
    - cron: '47 16 * * *'
  workflow_dispatch:

# Prevents overlapping manual and scheduled runs from colliding on data.json
concurrency:
  group: suntracker-data-update
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: pip install requests

      - name: Run Update Script
        run: python update_data.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update suntracker data log"
            git pull --rebase -X theirs
            git push
          fi
