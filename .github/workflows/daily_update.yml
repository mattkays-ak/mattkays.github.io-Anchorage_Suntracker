name: Daily Anchorage Suntracker Update

on:
  schedule:
    # 17:00 UTC corresponds to 9:00 AM Alaska Daylight Time (AKDT)
    - cron: '0 17 * * *'
  workflow_dispatch: # Allows you to manually trigger the run from the Actions tab

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          # Add any required packages here (e.g., requests, gspread)
          # pip install requests

      - name: Run Update Script
        run: |
          # Replace 'update_data.py' with the name of your backend script
          python update_data.py
