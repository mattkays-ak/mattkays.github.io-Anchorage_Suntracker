name: Daily Anchorage Suntracker Update

on:
  schedule:
    # Runs at 16:47 UTC (8:47 AM AKDT in summer / 7:47 AM AKST in winter)
    - cron: '47 16 * * *'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 5 # Prevents hung network calls from running 15+ minutes
    permissions:
      contents: write # Essential for committing updated data.json back to main

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12' # Stable release (avoids experimental pre-releases via '3.x')

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Update Script
        run: python update_data.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "Auto-update suntracker data log"
            git pull --rebase
            git push
          fi
