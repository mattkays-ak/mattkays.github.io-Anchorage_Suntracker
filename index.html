<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Anchorage Suntracker</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=JetBrains+Mono&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #F5F1E8;
      --card-border: #E2DDD3;
      --text-main: #111111;
      --text-sub: #76736E;
      --accent-orange: #E25B36;
      --accent-yellow: #F0B35B;
    }
    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', sans-serif;
      margin: 0; padding: 40px;
    }
    .header {
      display: flex; justify-content: space-between;
      font-family: 'JetBrains Mono', monospace; font-size: 11px;
      color: var(--text-sub); text-transform: uppercase; letter-spacing: 1px;
    }
    .title-area {
      display: grid;
      grid-template-columns: 1fr 300px;
      margin-top: 20px;
    }
    h1 { font-size: 56px; font-weight: 800; margin: 10px 0; letter-spacing: -1.5px; }
    h1 span { color: var(--accent-orange); font-style: italic; font-weight: 400; }
    .subtext { font-size: 18px; color: var(--text-sub); max-width: 400px; line-height: 1.4; }

    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 40px; }
    .card {
      border: 1px solid var(--card-border); padding: 24px;
      display: flex; flex-direction: column; justify-content: space-between; min-height: 180px;
    }
    .card-label { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-sub); text-transform: uppercase; }
    .metric-primary { font-size: 48px; font-weight: 800; margin: 10px 0; }
    .metric-sub { font-size: 14px; color: var(--text-sub); }
  </style>
</head>
<body>

  <div class="header">
    <div>DAILY FIELD NOTES • 61.2181° N, 149.9003° W</div>
    <div id="update-date">UPDATED --</div>
  </div>

  <!-- TOP TITLE AREA & GRAPHIC -->
  <div class="title-area">
    <!-- Left Column: Titles & Subtext -->
    <div>
      <div style="color: var(--accent-orange); font-family: 'JetBrains Mono'; font-size: 11px; text-transform: uppercase;">
        Today in Anchorage
      </div>
      <h1>Anchorage <span>Suntracker</span></h1>
      <p class="subtext">
        A living record of weather, light, and the moon for our corner of Alaska.
      </p>
    </div>
    
    <!-- Right Column: Canvas Orbit Visualizer Container -->
    <div style="display: flex; justify-content: center; align-items: center; position: relative;">
      <canvas id="skyCanvas" width="260" height="260"></canvas>
    </div>
  </div>

  <div class="grid">
    <div class="card">
      <div class="card-label">Forecast Range</div>
      <div class="metric-primary" id="temp-range">--° <span style="color:var(--text-sub); font-weight:400;">/ --°</span></div>
      <div class="metric-sub" id="condition">Loading...</div>
    </div>

    <div class="card">
      <div class="card-label">Daylight</div>
      <div class="metric-primary" id="daylight">--h --m</div>
      <div class="metric-sub"><span id="sunrise">--:--</span> sunrise • <span id="sunset">--:--</span> sunset</div>
    </div>

    <div class="card">
      <div class="card-label">Moon Report</div>
      <div class="metric-primary" id="moon-phase" style="font-size: 32px; text-transform: capitalize;">--</div>
      <div class="metric-sub" id="moon-illum">--% illuminated</div>
    </div>
  </div>

  <script>
    const SHEET_ID = '1WVrak9Kjjis9tDC70r_sYcIGZ5o2P5Nf0b9FrCbgPbw';
  const URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json`;

  function drawSkyLog(sunriseStr, sunsetStr) {
    const canvas = document.getElementById('skyCanvas');
    if (!canvas) return;
    
    const ctx = canvas.getContext('2d');
    const width = canvas.width;
    const height = canvas.height;
    const centerX = width / 2;
    const centerY = height / 2;
    const radius = 100;

    ctx.clearRect(0, 0, width, height);

    // 1. Draw dashed outer orbit ring
    ctx.beginPath();
    ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
    ctx.strokeStyle = '#D8D3C8';
    ctx.setLineDash([2, 4]);
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.setLineDash([]);

    // 2. Parse Sunrise / Sunset (Handles "5:45 AM" or "5:45:12 AM")
    const parseTime = (timeStr) => {
      const d = new Date();
      if (!timeStr) return d;
      const parts = timeStr.trim().split(' ');
      const modifier = parts[1];
      const timeParts = parts[0].split(':').map(Number);
      let hours = timeParts[0];
      let minutes = timeParts[1] || 0;

      if (modifier === 'PM' && hours < 12) hours += 12;
      if (modifier === 'AM' && hours === 12) hours = 0;
      
      d.setHours(hours, minutes, 0, 0);
      return d;
    };

    const now = new Date();
    const sunrise = parseTime(sunriseStr);
    const sunset = parseTime(sunsetStr);
    
    let progress = 0;
    if (now > sunrise && now < sunset) {
      progress = (now - sunrise) / (sunset - sunrise);
    } else if (now >= sunset) {
      progress = 1;
    }

    const angle = Math.PI * (0.75 + progress * 1.5);

    // 3. Draw central glow / Sun disc
    ctx.beginPath();
    ctx.arc(centerX, centerY - 10, 48, 0, 2 * Math.PI);
    ctx.fillStyle = 'rgba(244, 189, 104, 0.25)';
    ctx.fill();

    ctx.beginPath();
    ctx.arc(centerX, centerY - 10, 38, 0, 2 * Math.PI);
    ctx.fillStyle = '#F4BD68';
    ctx.fill();

    // 4. Draw current Sun position indicator dot
    const sunX = centerX + radius * Math.cos(angle);
    const sunY = centerY + radius * Math.sin(angle);

    ctx.beginPath();
    ctx.arc(sunX, sunY, 5, 0, 2 * Math.PI);
    ctx.fillStyle = '#E25B36';
    ctx.fill();

    // 5. Center Label Text
    ctx.font = '10px "JetBrains Mono", monospace';
    ctx.fillStyle = '#111111';
    ctx.textAlign = 'center';
    ctx.fillText('ALASKA', centerX, centerY + 65);
    ctx.fillText('SKY LOG', centerX, centerY + 78);
  }

  fetch(URL)
    .then(res => res.text())
    .then(data => {
      const json = JSON.parse(data.substring(47, data.length - 2));
      const rows = json.table.rows;
      if (!rows || rows.length === 0) return;

      const latest = rows[rows.length - 1].c;

      // Extract raw values safely
      const val = (idx) => (latest[idx] && latest[idx].v !== null) ? latest[idx].v : '--';

      document.getElementById('update-date').innerText = `UPDATED ${val(0)}`;
      document.getElementById('temp-range').innerHTML = `${val(1)}° <span style="color:var(--text-sub); font-weight:400;">/ ${val(2)}°</span>`;
      document.getElementById('condition').innerText = val(3);
      document.getElementById('sunrise').innerText = val(4);
      document.getElementById('sunset').innerText = val(5);
      document.getElementById('daylight').innerText = val(6);
      document.getElementById('moon-phase').innerText = val(7);
      document.getElementById('moon-illum').innerText = val(8).toString().includes('%') ? val(8) : `${val(8)} illuminated`;

      drawSkyLog(val(4), val(5));
    })
    .catch(err => console.error("Sheet Fetch Error:", err));
  </script>
</body>
</html>
