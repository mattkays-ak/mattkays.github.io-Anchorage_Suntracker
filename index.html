<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Anchorage Suntracker</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=JetBrains+Mono&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #F5F1E8;
      --card-border: #E2DDD3;
      --text-main: #111111;
      --text-sub: #76736E;
      --accent-orange: #E25B36;
      --accent-yellow: #F0B35B;
    }
    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', sans-serif;
      margin: 0; padding: 40px;
    }
    .header {
      display: flex; justify-content: space-between;
      font-family: 'JetBrains Mono', monospace; font-size: 11px;
      color: var(--text-sub); text-transform: uppercase; letter-spacing: 1px;
    }
    .title-area { margin-top: 20px; display: grid; grid-template-columns: 1fr 300px; }
    h1 { font-size: 56px; font-weight: 800; margin: 10px 0; letter-spacing: -1.5px; }
    h1 span { color: var(--accent-orange); font-style: italic; font-weight: 400; }
    .subtext { font-size: 18px; color: var(--text-sub); max-width: 400px; line-height: 1.4; }
    
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 40px; }
    .card {
      border: 1px solid var(--card-border); padding: 24px;
      display: flex; flex-direction: column; justify-content: space-between; min-height: 180px;
    }
    .card-label { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-sub); text-transform: uppercase; }
    .metric-primary { font-size: 48px; font-weight: 800; margin: 10px 0; }
    .metric-sub { font-size: 14px; color: var(--text-sub); }
  </style>
</head>
<body>

  <div class="header">
    <div>DAILY FIELD NOTES • 61.2181° N, 149.9003° W</div>
    <div id="update-date">UPDATED --</div>
  </div>

  <div class="title-area">
    <div>
      <div style="color: var(--accent-orange); font-family: 'JetBrains Mono'; font-size: 11px; text-transform: uppercase;">Today in Anchorage</div>
      <h1>Anchorage <span>Suntracker</span></h1>
      <p class="subtext">A living record of weather, light, and the moon for our corner of Alaska.</p>
    </div>
  </div>

  <div class="grid">
    <div class="card">
      <div class="card-label">Forecast Range</div>
      <div class="metric-primary" id="temp-range">--° <span style="color:var(--text-sub); font-weight:400;">/ --°</span></div>
      <div class="metric-sub" id="condition">Loading...</div>
    </div>

    <div class="card">
      <div class="card-label">Daylight</div>
      <div class="metric-primary" id="daylight">--h --m</div>
      <div class="metric-sub"><span id="sunrise">--:--</span> sunrise • <span id="sunset">--:--</span> sunset</div>
    </div>

    <div class="card">
      <div class="card-label">Moon Report</div>
      <div class="metric-primary" id="moon-phase" style="font-size: 32px; text-transform: capitalize;">--</div>
      <div class="metric-sub" id="moon-illum">--% illuminated</div>
    </div>
  </div>

  <script>
    // Replace with your Google Sheet ID
    const SHEET_ID = 'YOUR_GOOGLE_SHEET_ID';
    const URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json`;

    fetch(URL)
      .then(res => res.text())
      .then(data => {
        const json = JSON.parse(data.substr(47).slice(0, -2));
        const rows = json.table.rows;
        const latest = rows[rows.length - 1].c; // Most recent 9 AM entry

        document.getElementById('update-date').innerText = `UPDATED ${latest[0].v}`;
        document.getElementById('temp-range').innerHTML = `${latest[1].v}° <span style="color:var(--text-sub); font-weight:400;">/ ${latest[2].v}°</span>`;
        document.getElementById('condition').innerText = latest[3].v;
        document.getElementById('sunrise').innerText = latest[4].v;
        document.getElementById('sunset').innerText = latest[5].v;
        document.getElementById('daylight').innerText = latest[6].v;
        document.getElementById('moon-phase').innerText = latest[7].v;
        document.getElementById('moon-illum').innerText = `${latest[8].v} illuminated`;
      });
  </script>
</body>
</html>
